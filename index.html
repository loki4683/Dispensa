<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispensa</title>
<meta name="theme-color" content="#2c4a6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f0e9; --card:#fffdf9; --ink:#22262e; --muted:#6d6f76; --line:#ddd8cc;
  --accent:#2c4a6e; --accent-ink:#fff;
  --g-bg:#d9efd2; --g-bd:#3f9142; --g-ink:#1d4a20;
  --x-bg:#e6e4df; --x-bd:#b3afa6; --x-ink:#77736b;
  --y-bg:#fdeca6; --y-bd:#d6a100; --y-ink:#5a4300;
  --r-bg:#f9d2ca; --r-bd:#cf3a25; --r-ink:#7a1b0e;
  --n-bg:#e3eaf3; --n-bd:#8ea3bd; --n-ink:#2c4a6e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d; --card:#20232a; --ink:#eceae4; --muted:#9a9ca3; --line:#33363e;
    --accent:#8fb3df; --accent-ink:#12161c;
    --g-bg:#1f3a22; --g-bd:#58b25b; --g-ink:#c9edc9;
    --x-bg:#2a2c31; --x-bd:#4a4d55; --x-ink:#8d9097;
    --y-bg:#45380a; --y-bd:#e0b422; --y-ink:#fbe9a6;
    --r-bg:#4a1a13; --r-bd:#ee6a55; --r-ink:#fbd0c8;
    --n-bg:#232c38; --n-bd:#5d7591; --n-ink:#c5d8ee;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--accent);color:var(--accent-ink);padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:20px;font-weight:700;flex:1}
#back{background:none;border:0;color:inherit;font-size:26px;line-height:1;padding:2px 10px 4px 4px}
#net{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
#net i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.4}
#net.ok i{background:#6fdc74;opacity:1}
#net.off i{background:#ffb14a;opacity:1}
main{flex:1;overflow-y:auto;padding:14px 12px 110px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(6,1fr)}
.tile{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;color:var(--ink)}
.tile.w{grid-column:span 3;padding:18px 6px 14px}
.tile svg{width:58px;height:58px;stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tile.w svg{width:66px;height:66px}
.tile b{font-size:15px;text-align:center;line-height:1.2}
.tile small{font-size:11.5px;color:var(--muted);text-align:center;min-height:15px}
.badge{position:absolute;top:8px;right:8px;background:var(--r-bd);color:#fff;border-radius:11px;min-width:22px;height:22px;line-height:22px;font-size:12px;font-weight:700;padding:0 6px}
.links{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.link{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.link span{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0 2px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:0 2px 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;vertical-align:-2px;margin-right:4px}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.pmain{flex:1;min-width:0;text-align:left;border:2px solid var(--bd);background:var(--sb);color:var(--si);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:1px}
.st-g{--sb:var(--g-bg);--bd:var(--g-bd);--si:var(--g-ink)}
.st-x{--sb:var(--x-bg);--bd:var(--x-bd);--si:var(--x-ink)}
.st-y{--sb:var(--y-bg);--bd:var(--y-bd);--si:var(--y-ink)}
.st-r{--sb:var(--r-bg);--bd:var(--r-bd);--si:var(--r-ink)}
.st-n{--sb:var(--n-bg);--bd:var(--n-bd);--si:var(--n-ink)}
.pn{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.ps{font-size:12.5px;opacity:.9}
.preso .pn{text-decoration:line-through;opacity:.6}
.side{flex:none;width:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--x-bd);display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.on .dot{background:var(--g-bd);border-color:var(--g-bd);color:#fff}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 4px 8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px}
.btn{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 12px;font-weight:700;font-size:16px}
.btn.alt{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
.btn.go{background:var(--g-bd);color:#fff}
.btn.danger{background:none;color:var(--r-bd);border:1px solid var(--line);flex:none}
.btn.sm{padding:10px 12px;font-size:14px;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.box p{margin:0 0 10px}
.box p:last-child{margin-bottom:0}
details.box{padding:0}
details.box summary{padding:13px 14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.box summary::-webkit-details-marker{display:none}
details.box summary b{flex:1;min-width:0}
details.box summary span{color:var(--muted);font-size:13px;flex:none;text-align:right}
details.box .in{padding:0 14px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border-radius:999px;padding:4px 10px;font-size:13px;border:1.5px solid var(--bd);background:var(--sb);color:var(--si)}
ul.items{margin:0 0 10px;padding-left:20px}
ul.items li span{color:var(--muted);font-size:13px}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=url],select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;width:100%}
.actions{display:flex;gap:8px}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:14px;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Indietro" hidden>‹</button>
  <h1 id="title">Dispensa</h1>
  <div id="net" hidden><i></i><span></span></div>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>

<dialog id="dAdd">
  <form id="fAdd">
    <h3 id="addTitle">Aggiungi prodotto</h3>
    <label>Nome del prodotto<input type="text" id="addName" autocomplete="off" maxlength="60" list="addList" required></label>
    <datalist id="addList"></datalist>
    <div class="actions">
      <button type="button" class="btn alt" id="addClose">Chiudi</button>
      <button type="submit" class="btn">Aggiungi</button>
    </div>
  </form>
</dialog>

<dialog id="dEdit">
  <form id="fEdit">
    <h3>Modifica prodotto</h3>
    <label>Nome<input type="text" id="edName" autocomplete="off" maxlength="60" required></label>
    <label>Dove si trova<select id="edLoc">
      <option value="frigo">Frigo</option><option value="freezer">Freezer</option>
      <option value="bevande">Frigo beveraggi</option><option value="armadio">Armadio</option>
      <option value="dispensa">Dispensa</option><option value="cantinetta">Cantinetta</option>
      <option value="tantum">Una tantum</option>
    </select></label>
    <div class="actions">
      <button type="button" class="btn danger" id="edDel">Elimina</button>
      <button type="button" class="btn alt" id="edClose">Annulla</button>
      <button type="submit" class="btn">Salva</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
'use strict';
/* Indirizzo del server di condivisione: se lo scrivi qui, non serve inserirlo nell'app. */
const DEFAULT_SERVER = 'https://dispensa.loki4683.workers.dev';

const KEY = 'dispensa-v2', KEY_SYNC = 'dispensa-sync', KEY_SRV = 'dispensa-server';
const LOCS = {frigo:'Frigo', freezer:'Freezer', bevande:'Frigo beveraggi', armadio:'Armadio', dispensa:'Dispensa', cantinetta:'Cantinetta'};
const NOMI = Object.assign({tantum:'Una tantum'}, LOCS);
const TITOLI = Object.assign({home:'Dispensa', carrello:'Carrello della spesa',
  ricette:'Ricettario', tantum:'Prodotti una tantum', storico:'Spese fatte', condividi:'Lista condivisa'}, LOCS);
const TOMB_MS = 60 * 86400000;

const $ = s => document.querySelector(s);
const main = $('#main'), bar = $('#bar');
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const pl = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

/* ---------- dati ---------- */
let S = loadState();
let view = 'home', addCtx = '', editId = null;

function loadState(){
  let s = null;
  try { s = JSON.parse(lsGet(KEY)); } catch (e) {}
  if (!s || typeof s.p !== 'object' || typeof s.s !== 'object' || !s.p || !s.s) s = {p:{}, s:{}};
  const lim = now() - TOMB_MS;
  for (const k of ['p','s']) for (const id in s[k]) if (s[k][id].d && s[k][id].u < lim) delete s[k][id];
  return s;
}
function saveLocal(){ lsSet(KEY, JSON.stringify(S)); }
function changed(){ saveLocal(); dirty = true; scheduleSync(300); }
function live(){ return Object.values(S.p).filter(p => !p.d); }
function byName(a, b){ return a.n.localeCompare(b.n, 'it', {sensitivity:'base'}); }
function put(rec){ rec.u = now(); S.p[rec.id] = rec; changed(); }
function touch(rec){ rec.u = now(); changed(); }
function stato(p){ return p.l === 'tantum' ? (p.c ? 'y' : 'n') : p.c ? (p.ok ? 'y' : 'r') : (p.ok ? 'g' : 'x'); }
const STATO_TXT = {g:'C’è', x:'Finito', y:'C’è ancora · nel carrello', r:'Finito · nel carrello'};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- condivisione ---------- */
let cfg = null, dirty = true, busy = false, syncT = null, net = '';
try { cfg = JSON.parse(lsGet(KEY_SYNC)); } catch (e) {}
if (cfg && !(cfg.url && cfg.code)) cfg = null;

function merge(a, b){
  let chg = false, ahead = false;
  for (const k of ['p','s']){
    const A = a[k], B = (b && b[k]) || {};
    for (const id in B){
      const r = B[id];
      if (r && typeof r.u === 'number' && (!A[id] || r.u > A[id].u)){ A[id] = r; chg = true; }
    }
    for (const id in A){
      if (B[id] ? A[id].u > B[id].u : !A[id].d) ahead = true;
    }
  }
  return {chg, ahead};
}
function setNet(v){
  net = v;
  const el = $('#net');
  el.hidden = !cfg;
  el.className = v;
  el.querySelector('span').textContent = v === 'ok' ? 'Condivisa' : v === 'off' ? 'Non in linea' : '…';
}
function scheduleSync(ms){ if (!cfg) return; clearTimeout(syncT); syncT = setTimeout(sync, ms); }
async function sync(){
  if (!cfg || busy) return;
  busy = true; clearTimeout(syncT);
  const url = cfg.url + '/l/' + cfg.code;
  try {
    const r = await fetch(url, dirty
      ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(S)}
      : {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const m = merge(S, await r.json());
    dirty = m.ahead;
    if (m.chg){ saveLocal(); if (view !== 'condividi') render(); }
    setNet('ok');
  } catch (e) { setNet('off'); }
  busy = false;
  if (cfg) scheduleSync(dirty && net === 'ok' ? 250 : 10000);
}
function setCfg(c){
  cfg = c;
  lsSet(KEY_SYNC, c ? JSON.stringify(c) : null);
  if (c) lsSet(KEY_SRV, c.url);
  dirty = true; setNet('');
  if (c) sync(); else clearTimeout(syncT);
}
function serverUrl(){ return (cfg && cfg.url) || lsGet(KEY_SRV) || DEFAULT_SERVER; }
function cleanUrl(u){ u = String(u || '').trim().replace(/\/+$/, ''); return /^https?:\/\/[^\s]+$/.test(u) ? u : ''; }
function parseJoin(text, srv){
  text = String(text || '').trim();
  const c = /lista=([A-Za-z0-9]{12,40})/.exec(text), s = /srv=([^&\s]+)/.exec(text);
  if (c && s){ let u = ''; try { u = cleanUrl(decodeURIComponent(s[1])); } catch (e) {} return u ? {code:c[1], url:u} : null; }
  if (/^[A-Za-z0-9]{12,40}$/.test(text) && srv) return {code:text, url:srv};
  return null;
}
function inviteLink(){ return location.origin + location.pathname + '#lista=' + cfg.code + '&srv=' + encodeURIComponent(cfg.url); }
function newCode(){
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', a = new Uint8Array(20);
  crypto.getRandomValues(a);
  return Array.from(a, x => abc[x % abc.length]).join('');
}

/* ---------- icone ---------- */
const ICO = {
  frigo:'<svg viewBox="0 0 64 64"><rect x="16" y="5" width="32" height="52" rx="5"/><path d="M16 25h32M23 12v7M23 32v10M21 57v3M43 57v3"/></svg>',
  armadio:'<svg viewBox="0 0 64 64"><rect x="8" y="9" width="48" height="45" rx="4"/><path d="M32 9v45M14 54v5M50 54v5"/><circle cx="26.5" cy="32" r="1.8"/><circle cx="37.5" cy="32" r="1.8"/></svg>',
  dispensa:'<svg viewBox="0 0 64 64"><rect x="8" y="5" width="48" height="54" rx="4"/><path d="M8 23h48M8 41h48"/><rect x="14" y="11" width="8" height="12" rx="2"/><rect x="27" y="14" width="10" height="9" rx="2"/><circle cx="46" cy="17.5" r="5"/><rect x="14" y="30" width="12" height="11" rx="2"/><rect x="32" y="28" width="7" height="13" rx="2"/><rect x="43" y="32" width="8" height="9" rx="2"/><rect x="14" y="48" width="10" height="11" rx="2"/><rect x="30" y="50" width="18" height="9" rx="2"/></svg>',
  freezer:'<svg viewBox="0 0 64 64"><rect x="14" y="5" width="36" height="52" rx="5"/><path d="M20 57v3M44 57v3M32 17v28M20 24l24 14M44 24L20 38M28 18l4 3 4-3M28 44l4-3 4 3"/></svg>',
  bevande:'<svg viewBox="0 0 64 64"><rect x="13" y="4" width="38" height="54" rx="4"/><rect x="18" y="9" width="28" height="44" rx="2"/><path d="M18 31h28M45 24v14M19 58v3M45 58v3"/><path d="M23 29v-9l1.5-3v-3h2v3l1.5 3v9zM32 29v-12h5v12zM23 51v-11l1.5-3v-2h2v2l1.5 3v11zM32 51v-9h6v9z"/></svg>',
  cantinetta:'<svg viewBox="0 0 64 64"><rect x="8" y="5" width="48" height="54" rx="4"/><path d="M8 23h48M8 41h48"/><circle cx="18" cy="14" r="4.5"/><circle cx="32" cy="14" r="4.5"/><circle cx="46" cy="14" r="4.5"/><circle cx="18" cy="32" r="4.5"/><circle cx="32" cy="32" r="4.5"/><circle cx="46" cy="32" r="4.5"/><circle cx="18" cy="50" r="4.5"/><circle cx="32" cy="50" r="4.5"/><circle cx="46" cy="50" r="4.5"/><circle cx="18" cy="14" r="1.2"/><circle cx="32" cy="32" r="1.2"/><circle cx="46" cy="50" r="1.2"/></svg>',
  carrello:'<svg viewBox="0 0 64 64"><path d="M5 10h9l7 31h27l7-23H16"/><circle cx="24" cy="51" r="4"/><circle cx="45" cy="51" r="4"/></svg>',
  ricette:'<svg viewBox="0 0 64 64"><rect x="11" y="5" width="42" height="54" rx="5"/><path d="M20 5v54"/><ellipse cx="31" cy="22" rx="4" ry="6"/><path d="M31 28v18M43 15v31M39 15v8a4 4 0 0 0 8 0v-8"/></svg>'
};

/* ---------- viste ---------- */
function vHome(){
  const all = live(), nCart = all.filter(p => p.c).length;
  const sub = l => { const a = all.filter(p => p.l === l), f = a.filter(p => !p.ok).length;
    return a.length ? (a.length - f) + ' ci sono' + (f ? ' · ' + pl(f, 'finito', 'finiti') : '') : 'Vuoto'; };
  const tile = (v, name, s, w, badge) => '<button class="tile' + (w ? ' w' : '') + '" data-go="' + v + '">' + ICO[v] +
    '<b>' + name + '</b><small>' + s + '</small>' + (badge ? '<span class="badge">' + badge + '</span>' : '') + '</button>';
  const nT = all.filter(p => p.l === 'tantum').length, nS = Object.values(S.s).filter(x => !x.d).length;
  main.innerHTML = '<div class="tiles">' +
    Object.keys(LOCS).map(l => tile(l, LOCS[l], sub(l))).join('') +
    tile('carrello', 'Carrello della spesa', nCart ? pl(nCart, 'prodotto', 'prodotti') + ' da comprare' : 'Vuoto', 1, nCart) +
    tile('ricette', 'Ricettario', 'Idee con quello che hai', 1) + '</div>' +
    '<div class="links">' +
    '<button class="link" data-go="tantum"><b>Prodotti una tantum</b><span>' + nT + ' ›</span></button>' +
    '<button class="link" data-go="storico"><b>Spese fatte</b><span>' + nS + ' ›</span></button>' +
    '<button class="link" data-go="condividi"><b>Lista condivisa</b><span>' + (cfg ? 'Attiva' : 'Non attiva') + ' ›</span></button></div>';
  bar.hidden = true;
}

function rowProd(p){
  const st = stato(p);
  return '<div class="row st-' + st + '" data-id="' + p.id + '">' +
    '<button class="pmain" data-a="cart"><span class="pn">' + esc(p.n) + '</span><span class="ps">' + STATO_TXT[st] + '</span></button>' +
    '<button class="side' + (p.ok ? ' on' : '') + '" data-a="ok" aria-label="' + (p.ok ? 'Segna come finito' : 'Segna come presente') + '"><span class="dot">✓</span></button>' +
    '<button class="side" data-a="edit" aria-label="Modifica">⋯</button></div>';
}
function vLoc(){
  const list = live().filter(p => p.l === view).sort(byName);
  let h = '<p class="hint">Tocca il nome per mettere il prodotto nel carrello (o toglierlo). Tocca il cerchio per segnare se c’è o è finito.</p>' +
    '<div class="legend"><span><i style="background:var(--g-bg);border-color:var(--g-bd)"></i>C’è</span>' +
    '<span><i style="background:var(--x-bg);border-color:var(--x-bd)"></i>Finito</span>' +
    '<span><i style="background:var(--y-bg);border-color:var(--y-bd)"></i>Nel carrello, c’è ancora</span>' +
    '<span><i style="background:var(--r-bg);border-color:var(--r-bd)"></i>Nel carrello, finito</span></div>';
  h += list.length ? list.map(rowProd).join('') : '<div class="empty">Qui non c’è ancora niente.<br>Usa «Aggiungi prodotto» qui sotto.</div>';
  main.innerHTML = h;
  setBar('<button class="btn" data-a="add">+ Aggiungi prodotto</button>');
}

function vCarrello(){
  const list = live().filter(p => p.c);
  let h = '';
  if (!list.length) h = '<div class="empty">Il carrello è vuoto.<br>Tocca un prodotto in uno dei tuoi spazi (Frigo, Dispensa…) per metterlo qui, oppure aggiungi un prodotto una tantum.</div>';
  else {

function fmtData(t){
  const d = new Date(t);
  const s = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1) + ' · ' + d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
}
function vStorico(){

      '<summary><b>' + fmtData(x.t) + '</b><span>' + pl(x.it.length, 'prodotto', 'prodotti') + '</span></summary><div class="in"><ul class="items">' +

function trova(lista, ing){
  const re = new RegExp('(?:^|[^a-z])(?:' + ing[1] + ')'), ex = ing[3] ? new RegExp(ing[3]) : null;
  return lista.find(x => re.test(x.k) && !(ex && ex.test(x.k)));
}
function valutaRicette(){
  const av = live().filter(p => LOCS[p.l] && p.ok).map(p => ({p, k:nrm(p.n)}));
  return {n:av.length, r:RICETTE.map((r, idx) => {
    const ing = r.i.map(i => ({i, m:trova(av, i)}));
    const req = ing.filter(x => !x.i[2]);
    const have = req.filter(x => x.m).length;
    return {r, idx, ing, tot:req.length, have, miss:req.length - have};
  })};
}
function vRicette(){
  const v = valutaRicette();
  bar.hidden = true;
  if (!v.n){
    main.innerHTML = '<div class="empty">Per avere delle proposte, segna prima cosa c’è in casa (Frigo, Dispensa e gli altri spazi).</div>';
    return;
  }
  const card = x => '<details class="box" data-r="' + x.idx + '"><summary><b>' + esc(x.r.n) + '</b><span>' + x.r.t + ' min<br>' +
      (x.miss ? 'manca' + (x.miss > 1 ? 'no ' : ' ') + x.miss : 'hai tutto') + '</span></summary><div class="in"><div class="chips">' +
      x.ing.map(g => '<span class="chip st-' + (g.m ? 'g' : g.i[2] ? 'x' : 'r') + '">' + esc(g.i[0]) + (g.i[2] && !g.m ? ' (facoltativo)' : '') + '</span>').join('') +
      '</div><p>' + esc(x.r.p) + '</p>' +
      (x.miss ? '<button class="btn alt sm" data-a="mancanti">Metti nel carrello quello che manca</button>' : '') + '</div></details>';
  const ord = (a, b) => (b.have / b.tot - a.have / a.tot) || a.r.t - b.r.t;
  const ok = v.r.filter(x => !x.miss).sort((a, b) => a.r.t - b.r.t);
  const quasi = v.r.filter(x => x.miss && x.miss <= 2 && x.have > 0).sort((a, b) => a.miss - b.miss || ord(a, b));
  let h = '<p class="hint">Proposte calcolate su ' + pl(v.n, 'prodotto presente', 'prodotti presenti') + ' in casa. Olio, sale, pepe e acqua si danno per scontati.</p>';
  h += '<h2>Puoi farle adesso</h2>' + (ok.length ? ok.map(card).join('') : '<div class="box"><p>Nessuna ricetta completa con quello che c’è ora.</p></div>');
  if (quasi.length) h += '<h2>Ti manca poco</h2>' + quasi.map(card).join('');
  main.innerHTML = h;
}
function aggiungiMancanti(idx){
  const x = valutaRicette().r.find(y => y.idx === idx);
  if (!x) return;
  const tutti = live().map(p => ({p, k:nrm(p.n)}));
  let n = 0;
  for (const g of x.ing){
    if (g.m || g.i[2]) continue;
    const ex = trova(tutti, g.i);
    if (ex){ if (!ex.p.c){ ex.p.c = 1; ex.p.k = 0; ex.p.u = now(); n++; } }
    else { const id = uid(); S.p[id] = {id, n:g.i[0], l:'tantum', ok:0, c:1, k:0, u:now()}; n++; }
  }
  changed(); render();
  toast(n ? pl(n, 'prodotto messo', 'prodotti messi') + ' nel carrello' : 'Era già tutto nel carrello');
}

/* ---------- navigazione ---------- */
function setBar(html){ bar.innerHTML = html; bar.hidden = false; }
function render(){
  $('#title').textContent = TITOLI[view] || 'Dispensa';
  $('#back').hidden = view === 'home';
  if (view === 'home') vHome();
  else if (LOCS[view]) vLoc();
  else if (view === 'carrello') vCarrello();
  else if (view === 'tantum') vTantum();
  else if (view === 'storico') vStorico();
  else if (view === 'ricette') vRicette();
  else vCondividi();
}
function go(v){ view = v; history.pushState({v}, ''); main.scrollTop = 0; render(); }
window.addEventListener('popstate', e => {
  document.querySelectorAll('dialog[open]').forEach(d => d.close());
  view = (e.state && e.state.v) || 'home'; render();
});
$('#back').addEventListener('click', () => history.back());

/* ---------- azioni ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ go(g.dataset.go); return; }
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, row = b.closest('[data-id]'), p = row && S.p[row.dataset.id];
  if (a === 'add') return apriAdd();
  if (a === 'fatta') return spesaEseguita();
  if (a === 'cart' && p){ p.c = p.c ? 0 : 1; p.k = 0; touch(p); render();
    toast(p.c ? '«' + p.n + '» messo nel carrello' : '«' + p.n + '» tolto dal carrello'); return; }
  if (a === 'ok' && p){ p.ok = p.ok ? 0 : 1; touch(p); render(); return; }
  if (a === 'preso' && p){ p.k = p.k ? 0 : 1; touch(p); render(); return; }
  if (a === 'uncart' && p){ p.c = 0; p.k = 0; touch(p); render(); return; }
  if (a === 'edit' && p) return apriEdit(p);
  if (a === 'delspesa'){
    const d = b.closest('[data-sid]'), x = d && S.s[d.dataset.sid];
    if (x && confirm('Eliminare questa spesa dall’elenco?')){ S.s[x.id] = {id:x.id, d:1, u:now()}; changed(); render(); }
    return;
  }
  if (a === 'mancanti') return aggiungiMancanti(+b.closest('[data-r]').dataset.r);
  if (a === 'crea'){
    const u = cleanUrl($('#srv').value);
    if (!u) return toast('Scrivi l’indirizzo del server (inizia con https://)');
    setCfg({url:u, code:newCode()}); render(); toast('Lista condivisa creata'); return;
  }
  if (a === 'entra'){
    const j = parseJoin($('#join').value, cleanUrl($('#srv').value));
    if (!j) return toast('Link o codice non valido');
    setCfg(j); render(); toast('Collegato alla lista'); return;
  }
  if (a === 'invita'){
    const link = inviteLink(), testo = 'Apri questo link per usare la nostra lista della Dispensa:';
    if (navigator.share) navigator.share({title:'Dispensa', text:testo, url:link}).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Link copiato'), () => prompt('Copia il link:', link));
    else prompt('Copia il link:', link);
    return;
  }
  if (a === 'scollega'){
    if (confirm('Scollegare questo telefono dalla lista condivisa?')){ setCfg(null); render(); }
    return;
  }
});

function apriAdd(){
  addCtx = view;
  $('#addTitle').textContent = LOCS[view] ? 'Aggiungi in ' + LOCS[view] : 'Aggiungi prodotto una tantum';
  $('#addList').innerHTML = LOCS[view] ? '' : live().filter(p => p.l === 'tantum' && !p.c).sort(byName).map(p => '<option value="' + esc(p.n) + '">').join('');
  $('#addName').value = '';
  $('#dAdd').showModal();
  $('#addName').focus();
}
$('#addClose').addEventListener('click', () => $('#dAdd').close());
$('#fAdd').addEventListener('submit', e => {
  e.preventDefault();
  const n = $('#addName').value.trim().slice(0, 60), k = nrm(n);
  if (!n) return;
  if (LOCS[addCtx]){
    const ex = live().find(p => p.l === addCtx && nrm(p.n) === k);
    if (ex) toast('«' + ex.n + '» c’è già in ' + LOCS[addCtx]);
    else { put({id:uid(), n, l:addCtx, ok:1, c:0, k:0}); toast('Aggiunto: ' + n); }
  } else {
    const all = live(), ex = all.find(p => p.l === 'tantum' && nrm(p.n) === k) || all.find(p => nrm(p.n) === k);
    if (ex){
      if (ex.c) toast('«' + ex.n + '» è già nel carrello');
      else { ex.c = 1; ex.k = 0; touch(ex); toast('«' + ex.n + '» messo nel carrello'); }
    } else { put({id:uid(), n, l:'tantum', ok:0, c:1, k:0}); toast('Aggiunto al carrello: ' + n); }
  }
  $('#addName').value = ''; $('#addName').focus();
  render();
});

function apriEdit(p){
  editId = p.id;
  $('#edName').value = p.n; $('#edLoc').value = p.l;
  $('#dEdit').showModal();
}
$('#edClose').addEventListener('click', () => $('#dEdit').close());
$('#edDel').addEventListener('click', () => {
  const p = S.p[editId];
  if (p && confirm('Eliminare «' + p.n + '»?')){ S.p[p.id] = {id:p.id, d:1, u:now()}; changed(); $('#dEdit').close(); render(); }
});
$('#fEdit').addEventListener('submit', e => {
  e.preventDefault();
  const p = S.p[editId], n = $('#edName').value.trim().slice(0, 60), l = $('#edLoc').value;
  if (!p || !n) return;
  if (l !== p.l){ p.ok = l === 'tantum' ? 0 : (p.l === 'tantum' ? 1 : p.ok); p.l = l; }
  p.n = n; touch(p);
  $('#dEdit').close(); render();
});

function spesaEseguita(){
  const cart = live().filter(p => p.c);
  if (!cart.length) return toast('Il carrello è vuoto');
  const presi = cart.filter(p => p.k), parz = presi.length && presi.length < cart.length;
  const list = presi.length ? presi : cart;
  if (!confirm(parz
    ? 'Registro ' + pl(presi.length, 'prodotto spuntato', 'prodotti spuntati') + '. Gli altri ' + (cart.length - presi.length) + ' restano nel carrello. Confermi?'
    : 'Registro la spesa di ' + pl(list.length, 'prodotto', 'prodotti') + ' e svuoto il carrello. Confermi?')) return;
  const t = now(), id = uid();
  S.s[id] = {id, t, it:list.sort(byName).map(p => ({n:p.n, l:p.l})), u:t};
  list.forEach(p => { p.c = 0; p.k = 0; if (p.l !== 'tantum') p.ok = 1; p.u = t; });
  changed(); render();
  toast('Spesa registrata in «Spese fatte»');
}

/* ---------- avvio ---------- */
(function(){
  const h = location.hash;
  history.replaceState({v:'home'}, '', location.pathname + location.search);
  if (/lista=/.test(h)){
    const j = parseJoin(h);
    if (j && !(cfg && cfg.code === j.code && cfg.url === j.url) &&
        confirm('Vuoi collegare questo telefono alla lista condivisa? I prodotti già presenti qui verranno uniti alla lista.')) setCfg(j);
  }
})();
render();
setNet('');
if (cfg) sync();
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) sync(); });
window.addEventListener('online', () => { if (cfg) sync(); });

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
